# Automated checks for db-lab (Stage 0, lesson A6). Each stage adds the jobs for what it builds.
name: CI

on:
  pull_request:
    branches: [main]               # every pull request into main
  push:
    branches: [main]               # and every merge that lands on main

permissions:
  contents: read                   # the jobs may read the repository, nothing more

jobs:
  # Fails if anything that looks like a password, key or token is found anywhere in the history.
  # Its name, "secret-scan", is what the ruleset on main requires (Stage 0, step C9).
  secret-scan:
    runs-on: ubuntu-latest         # a fresh Linux machine provided by GitHub for each run
    steps:
      - uses: actions/checkout@v7  # copy the repository onto that machine
        with:
          fetch-depth: 0           # the whole history, not only the latest commit
      - name: Gitleaks scan of the full history
        # A fixed Gitleaks version, never :latest (Stage 0, lesson A6). --redact hides any secret found,
        # so that the public log does not repeat it.
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          detect --source /repo --redact -v

  # Builds the Java project and runs all its tests, including those against a throwaway PostgreSQL and, from
  # Stage 6, a throwaway MongoDB, which Testcontainers starts on the runner's own Docker (Stage 2, lesson A11).
  # Its name, "java-build-test", is a required check on main (Stage 2, step C10).
  java-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java    # every "run" step starts in the java folder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6  # installs a JDK on the runner
        with:
          distribution: temurin    # the Eclipse Temurin build of OpenJDK
          java-version: "21"
          cache: maven             # keeps downloaded libraries between runs, so later runs start faster
      - run: mvn -B verify         # -B: batch mode, plain log output with no progress animation

  # Installs the Python project, checks its types, and runs all its tests, including those against a throwaway
  # PostgreSQL and, from Stage 6, a throwaway MongoDB, which Testcontainers starts on the runner's own Docker
  # (Stage 3, lesson A9). Its name, "python-build-test", is a required check on main (Stage 3, step C10).
  python-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python  # every "run" step starts in the python folder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7  # installs Python on the runner
        with:
          python-version: "3.14"
          cache: pip                   # keeps downloaded packages between runs
          cache-dependency-path: python/requirements*.txt   # a new cache whenever either file changes
      - run: pip install -r requirements-dev.txt
      - run: mypy billing mongo_lab    # the type check, of both packages: fails the job on any error
      - run: pytest -v                 # the tests: fail the job on any failure