# Settings added when the program runs with the Spring profile "measure" (Stage 4, step C7):
#   mvn spring-boot:run -Dspring-boot.run.profiles=measure -Dspring-boot.run.arguments=--measure.label=<name>
# Everything in application.properties still applies; these lines add to it or override it.

# No migrations in a measuring run, so that the "before the index" numbers can be taken while V3 waits.
spring.flyway.enabled=false
# Nor a check of the entities against the tables: before V4 runs, bill has no version column yet.
spring.jpa.hibernate.ddl-auto=none

# Hibernate counts the statements it sends (lesson A5), and is allowed to send inserts in batches of 1,000
# (lesson A6: it will not, for tables numbered by an identity column, which is what the measurement shows).
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.jdbc.batch_size=1000
# Statistics also make Hibernate log a block of counters after every session; keep the log readable.
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=warn