# Settings of the lab's Java program (Stage 2, lesson A3). Passwords come from environment variables,
# never from this file: ${LAB_APP_PASSWORD} is filled in from the environment when the program starts.
spring.application.name=billing-lab

# The program's own connections, as the application account (Stage 0: lab_app may read and write data only).
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/utility_lab
spring.datasource.username=lab_app
spring.datasource.password=${LAB_APP_PASSWORD}

# The HikariCP connection pool (lesson A4).
spring.datasource.hikari.pool-name=billing-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# Flyway applies the migrations as the table owner, on the same database (lesson A5).
spring.flyway.user=lab_owner
spring.flyway.password=${LAB_OWNER_PASSWORD}
# Flyway normally takes its lock inside a transaction. A migration that must run outside one, such as
# CREATE INDEX CONCURRENTLY in V3, would then wait for Flyway's own transaction for ever. Session lock instead
# (Stage 4, lesson A4).
spring.flyway.postgresql.transactional-lock=false

# Hibernate checks at start-up that the entities match the tables Flyway built; it never changes them (lesson A7).
spring.jpa.hibernate.ddl-auto=validate
# Switched off on purpose (lesson A8).
spring.jpa.open-in-view=false

# MongoDB (Stage 6, lesson A9): the whole address, password included, comes from the environment variable
# MONGO_URI, so that the same program reaches the local MongoDB or Atlas by configuration alone. Without it, the
# default below (no login) is used: enough for the program to start, as the tests and CI give their own address.
# Spring Boot 4 calls this spring.mongodb.uri; Spring Boot 3 called it spring.data.mongodb.uri.
spring.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/utility_lab}