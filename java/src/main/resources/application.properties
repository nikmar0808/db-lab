# Settings of the lab's Java program (Stage 2, lesson A3). Passwords come from environment variables,
# never from this file: ${LAB_APP_PASSWORD} is filled in from the environment when the program starts.
spring.application.name=billing-lab

# The program's own connections, as the application account (Stage 0: lab_app may read and write data only).
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/utility_lab
spring.datasource.username=lab_app
spring.datasource.password=${LAB_APP_PASSWORD}

# The HikariCP connection pool (lesson A4).
spring.datasource.hikari.pool-name=billing-pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000

# Flyway applies the migrations as the table owner, on the same database (lesson A5).
spring.flyway.user=lab_owner
spring.flyway.password=${LAB_OWNER_PASSWORD}

# Hibernate checks at start-up that the entities match the tables Flyway built; it never changes them (lesson A7).
spring.jpa.hibernate.ddl-auto=validate
# Switched off on purpose (lesson A8).
spring.jpa.open-in-view=false