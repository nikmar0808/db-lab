# Alembic's settings for the practice database alembic_lab (Stage 3, lesson A7).
# Run alembic from the python folder with:  alembic -c alembic_practice/alembic.ini <command>

[alembic]
# Where env.py and the versions folder are: the folder of this file.
script_location = %(here)s
# The database address is built in env.py from the environment, so no password is ever written here.
sqlalchemy.url =

# Log settings, so that Alembic prints what it does ("Running upgrade ...").
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s